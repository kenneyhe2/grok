# Copy to ~/pi-oauth-tunnel/ngrok.yml on the Pi (or pass with: ngrok start --config ...)
# Replace AUTHTOKEN_HERE with agent authtoken from https://dashboard.ngrok.com/get-started/your-authtoken
version: "3"
agent:
  authtoken: AUTHTOKEN_HERE

# endpoints (v3). pooling_enabled allows a second agent to join the same URL
# instead of ERR_NGROK_334 when the domain is already online.
endpoints:
  - name: oauth
    url: https://disinfective-unmeditated-rhoda.ngrok-free.dev
    pooling_enabled: true
    upstream:
      url: http://127.0.0.1:8790
